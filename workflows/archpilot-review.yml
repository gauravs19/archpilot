# .github/workflows/archpilot-review.yml
name: Archpilot AI Architecture Review

on:
  pull_request:
    paths:
      - 'docs/**'  # Trigger only when files in the docs folder change
      - 'architecture/**'

jobs:
  archpilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Archpilot AI Reviewer
        uses: gauravs19/archpilot-reviewer@v1
        with:
          # Required: GitHub token for posting comments
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Required: OpenAI API Key (or other supported providers)
          # Make sure to add this to your Repo Secrets!
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          
          # Optional: Central rules repo (Default is current repo)
          rules_repo: 'gauravs19/archpilot'
          
          # Optional: Path to rules within the rules_repo
          rules_path: 'rules'
          
          # Optional: Path to architecture docs in THIS repo
          docs_path: './docs'
